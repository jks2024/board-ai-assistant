# 전체 검증: MySQL 8 + Spring Boot(빌드·테스트·실행) + FastAPI(stub) + 시나리오 점검 + React 빌드
name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test1234
          MYSQL_DATABASE: board_ai
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -ptest1234"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai-service/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: .env 만들기 (테스트용 값)
        run: |
          mkdir -p reports
          cat > backend/.env <<EOT
          MYSQL_PASSWORD=test1234
          JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
          SERVICE_TOKEN=ci-service-token
          ADMIN_EMAILS=admin@test.com
          EOT
          printf "SERVICE_TOKEN=ci-service-token\nRAG_ENGINE=stub\n" > ai-service/.env

      - name: ai-service 테스트 (pytest)
        working-directory: ai-service
        run: |
          set -o pipefail
          pip install -r requirements.txt
          pytest -q 2>&1 | tee ../reports/1_pytest.txt

      - name: backend 테스트 (Gradle + MySQL)
        working-directory: backend
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon 2>&1 | tee ../reports/2_gradle.txt

      - name: frontend 빌드
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          CI=true npm run build 2>&1 | tee ../reports/3_react.txt

      - name: 세 서버 중 AI·백엔드 실행
        run: |
          (cd ai-service && nohup uvicorn app:app --port 8000 > ../reports/ai.log 2>&1 &)
          (cd backend && nohup java -jar $(ls build/libs/*.jar | grep -v plain) > ../reports/spring.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8111/board/list >/dev/null && curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
          curl -s localhost:8000/health

      - name: 시나리오 점검 (seed → all → down → recover)
        working-directory: ai-service
        run: |
          set -o pipefail
          python scripts/seed.py 2>&1 | tee ../reports/4_seed.txt
          python scripts/e2e_check.py all 2>&1 | tee ../reports/5_e2e_all.txt
          pkill -f "uvicorn app:app"; sleep 2
          python scripts/e2e_check.py down 2>&1 | tee ../reports/6_e2e_down.txt
          (nohup uvicorn app:app --port 8000 >> ../reports/ai.log 2>&1 &); sleep 4
          python scripts/e2e_check.py recover 2>&1 | tee ../reports/7_e2e_recover.txt

      - name: 결과 요약
        if: always()
        run: |
          { echo "## 검증 결과"; for f in reports/[0-9]*.txt; do echo "### $f"; echo '```'; tail -40 "$f"; echo '```'; done; } >> $GITHUB_STEP_SUMMARY
          cp backend/build/test-results/test/*.xml reports/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-reports, path: reports/ }

      # 커밋 메시지에 [report] 가 있으면 결과를 ci-results 브랜치에 남김 (작성자 확인용)
      - name: 결과 브랜치에 기록
        if: always() && contains(github.event.head_commit.message, '[report]')
        run: |
          cd reports && git init -q && git checkout -q -b ci-results
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          echo "${{ github.sha }} ${{ job.status }}" > STATUS && git add -A && git commit -qm "verify ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
