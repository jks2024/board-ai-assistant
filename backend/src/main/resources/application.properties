spring.application.name=board-ai-backend
server.port=8111

# 비밀 값은 프로젝트 루트의 .env 에서 읽습니다. (.env 는 .gitignore 에 등록, .env.example 참고)
# .env 값에는 따옴표를 쓰지 않습니다. 이 파일의 주석은 항상 별도 줄에 씁니다.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/board_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
# create 는 실행할 때마다 테이블을 지웁니다. 컬럼 추가를 반영하면서 데이터를 남기려면 update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

jwt.secret=${JWT_SECRET}
jwt.access-exp-ms=1800000
jwt.refresh-exp-ms=604800000

kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao}

# 이 이메일로 가입하면 ROLE_ADMIN (쉼표로 여러 개). 전체 재색인 /admin/rag/reindex 에 사용
app.admin-emails=${ADMIN_EMAILS:admin@test.com}

# ── RAG(AI 서비스) 연동 ── FastAPI 주소와 서비스 토큰(FastAPI .env 의 SERVICE_TOKEN 과 같은 값)
rag.base-url=${RAG_BASE_URL:http://localhost:8000}
rag.service-token=${SERVICE_TOKEN}
rag.connect-timeout-ms=2000
rag.read-timeout-ms=60000
